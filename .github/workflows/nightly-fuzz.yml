name: nightly-fuzz
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "number of random graphs"
        default: "1000000"
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: differential fuzzing (engine, oracle, incremental, deny, probe)
        run: python tests/fuzz.py --seeds ${{ github.event.inputs.seeds || '1000000' }} --start ${{ github.run_number }}000000
      - name: scale benchmarks
        working-directory: benchmarks
        run: python bench_scale.py 100000 1000000 && python bench_check.py 1000000 10
