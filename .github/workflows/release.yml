# Publish PathCutter to PyPI on a version tag, using PyPI Trusted Publishing (OIDC - no stored token).
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/): register a trusted publisher for this project
#   Owner: farouq7assan0o   Repository: PathCutter   Workflow: release.yml   Environment: pypi
# Then push a tag that matches the version in pyproject.toml, e.g.  git tag v0.7.0 && git push origin v0.7.0
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi            # protect this environment in repo settings (manual approval / tag rules)
    permissions:
      id-token: write            # trusted publishing needs this on the publish job only
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
