[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pathcutter"
version = "0.1.0"
description = "AD Attack Path Risk Engine - quantified remediation for Active Directory"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pathcutter = "pathcutter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
pathcutter = ["graph_view.js"]
