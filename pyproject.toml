[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pathcutter"
version = "0.7.0"
description = "Offline attack-path risk engine for Active Directory, AD CS, Entra ID and Azure: find the fewest changes that cut the most paths to Domain Admin, and gate risky changes before they ship."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Farouq Hassan" }]
keywords = [
    "active-directory", "bloodhound", "attack-paths", "entra-id", "azure",
    "security", "pentest", "blue-team", "adcs", "tier-zero", "remediation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
]
dependencies = [
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyyaml>=6.0", "build>=1.0", "twine>=5.0"]
yaml = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/farouq7assan0o/PathCutter"
Repository = "https://github.com/farouq7assan0o/PathCutter"
Changelog = "https://github.com/farouq7assan0o/PathCutter/blob/main/CHANGELOG.md"
Issues = "https://github.com/farouq7assan0o/PathCutter/issues"

[project.scripts]
pathcutter = "pathcutter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["pathcutter", "pathcutter.extractors"]

[tool.setuptools.package-data]
pathcutter = ["graph_view.js", "data/*.json"]
